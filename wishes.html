<head>

<title>Печенье с предсказанием</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<body data-page="wishes">
<nav class="bar"><a href="menu.html">← Назад</a></nav>
<!-- ПЕЧЕНЬЕ С ПРЕДСКАЗАНИЕМ. Пожелания лежат в js/wishes.js, там их можно менять. -->
<div class="inner wishpage"><h2>Печенье с предсказанием</h2><p class="orn">✦</p>
<p class="lead">Нажми на печенье. Пожеланий здесь 365, как дней в году.</p>
<!-- СЦЕНА С ПЕЧЕНЬЕМ. Сами пожелания лежат в js/wishes.js -->
<div class="altar idle" id="stage">
  <canvas id="fx"></canvas><div class="rays"></div><div class="halo"></div>
  <div class="cookie"><svg viewBox="0 0 300 220" width="280" height="205" aria-hidden="true">
<defs>
<path id="pl" d="M150 62 C122 28 50 26 27 84 C8 134 54 184 108 188 C130 190 146 180 150 166 C140 130 140 96 150 62 Z"/><path id="pr" d="M150 62 C178 28 250 26 273 84 C292 134 246 184 192 188 C170 190 154 180 150 166 C160 130 160 96 150 62 Z"/>

<linearGradient id="ckb" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#F8E0A8"/><stop offset=".45" stop-color="#E0AC62"/><stop offset="1" stop-color="#B9792E"/></linearGradient>

</g>
</svg></div>
  <div class="paper"></div><div class="ring"></div><div class="ring r2"></div><div class="flash"></div>
  <p class="hint">Нажми на печенье</p>
</div>
<!-- КАРТОЧКА С ПОЖЕЛАНИЕМ: появляется под сценой после раскрытия печенья -->
<div class="wishbox" id="wishbox"><p id="wish"></p></div>
<p class="wcount" id="wishCount"></p>
<button class="btn" id="cookieBtn">Открыть печенье</button></div>
<script src="js/wishes.js"></script>
